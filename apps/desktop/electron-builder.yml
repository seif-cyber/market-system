appId: com.marketsystem.pos
productName: Market POS
directories:
  output: ../../release
files:
  - dist/**
  - package.json
  - ui/**
extraResources:
  - from: ../../packages/db/migrations
    to: migrations
asar: true
npmRebuild: true
win:
  target: nsis
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  language: "1025"
electronVersion: 33.2.1
