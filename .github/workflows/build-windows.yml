name: Build Windows installer and cloud site
on:
  workflow_dispatch:
  push:
    branches: [claude/kind-cannon-wcxb6i, main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build cloud site (Firebase Hosting bundle)
        run: npm run build -w @market/cloud
      - run: npm run build -w @market/ui
      - name: Build installer
        run: npm run dist -w @market/desktop
        env:
          # Public half of the license key pair (repo Settings > Secrets). The private key never goes here.
          LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: MarketPOS-Setup
          path: release/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-site
          path: apps/cloud/dist

  firestore-rules:
    # Security rules of the owner-link flow, tested on the Firestore emulator.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --prefix cloud/rules-test
      - run: npm test --prefix cloud/rules-test
